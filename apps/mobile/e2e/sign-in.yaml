# Needs no server, so it also runs on the iPhone simulator.
appId: dev.superagent.app
name: The sign-in screen
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "Scan the pairing code"
- assertVisible: "Or paste the pairing link"
- tapOn: "Use a server address and a token"
- tapOn:
    id: "sign-in-server"
- inputText: "http://192.168.1.20:4111"
- scrollUntilVisible:
    element:
      id: "sign-in-token"
- tapOn:
    id: "sign-in-token"
- inputText: "sa_smoke_test_token_not_a_real_one"
- scrollUntilVisible:
    element: "Sign in"
- tapOn: "Sign in"
# Plain HTTP reaches only localhost: anywhere else needs the server's https:// address.
- assertVisible: "Couldn’t sign in"
- assertVisible: ".*https://.*"
