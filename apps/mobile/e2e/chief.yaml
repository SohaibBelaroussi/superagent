# Needs the tests' fake model (MAESTRO_MODEL_URL, see setup.js). It answers "pong (fake-chat) …" with the
# start of your message, or, when the chief has a tool it calls first, "The tool said … The magic number
# is 42."
appId: dev.superagent.app
name: A conversation with the chief
tags:
  - server
  - model
---
- runFlow: common/pair.yaml
- tapOn: "Chief"
- assertVisible: "Chief of staff"
- tapOn:
    id: "chief-message"
- inputText: "Hello from the phone"
- tapOn: "Send"
# Your message at once, then the chief's answer, streamed and then stored.
- assertVisible: "Hello from the phone"
- extendedWaitUntil:
    visible: "(pong \\(fake-chat\\) Hello from the phone|.*The magic number is 42\\.)"
    timeout: 30000
- extendedWaitUntil:
    visible: "Routes your work to the departments"
    timeout: 30000
