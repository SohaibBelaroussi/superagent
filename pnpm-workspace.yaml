packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency build scripts by default. esbuild (used by tsx) needs its script;
# the others are optional native addons (ssh2/cpu-features via testcontainers) or banners.
# agent-browser's script downloads its native CLI from GitHub: we use only its JavaScript API.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - agent-browser
  - cpu-features
  - protobufjs
  - ssh2

# Optional peers pnpm would resolve from the apps, so the API would ship them without ever loading them:
# @mastra/mcp's ext-apps lists React (the web and phone apps bring it), drizzle-orm lists expo-sqlite (the
# phone app brings it, and with it Expo and React Native).
overrides:
  '@modelcontextprotocol/ext-apps>react': '-'
  '@modelcontextprotocol/ext-apps>react-dom': '-'
  'drizzle-orm>expo-sqlite': '-'

# Packages see each other's dependencies through pnpm's hidden hoist. The phone app's Jest brings
# @types/jsdom, which vitest's optional types would then find, pulling the DOM's globals into the API's
# typecheck. Jest still gets it as its own dependency.
hoistPattern:
  - '*'
  - '!@types/jsdom'

# expo-notifications, patched (D54): a notification's actions run only once the phone is unlocked, and
# a lock screen that hides private notifications shows only their kind. Pinned with the app's version.
# It ships a prebuilt Android library that would skip the patch: the phone app builds it from source
# (`expo.autolinking.buildFromSource` in apps/mobile/package.json).
patchedDependencies:
  expo-notifications@57.0.22: patches/expo-notifications@57.0.22.patch
