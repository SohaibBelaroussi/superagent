packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency build scripts by default. esbuild (used by tsx) needs its script;
# the others are optional native addons (ssh2/cpu-features via testcontainers) or banners.
# agent-browser's script downloads its native CLI from GitHub: we use only its JavaScript API.
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - agent-browser
  - cpu-features
  - protobufjs
  - ssh2

# @mastra/mcp's ext-apps lists React as an optional peer, which pnpm resolves once the web app brings
# React into the workspace: the API would ship React without ever loading it.
overrides:
  '@modelcontextprotocol/ext-apps>react': '-'
  '@modelcontextprotocol/ext-apps>react-dom': '-'

# Packages see each other's dependencies through pnpm's hidden hoist. The phone app's Jest brings
# @types/jsdom, which vitest's optional types would then find, pulling the DOM's globals into the API's
# typecheck. Jest still gets it as its own dependency.
hoistPattern:
  - '*'
  - '!@types/jsdom'
