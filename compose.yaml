name: superagent

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: superagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: superagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superagent -d superagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]
    restart: unless-stopped

  # Metasearch for the web tool pack. Internal use only: JSON API, no rate limiter.
  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-change-me-searxng-secret}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    networks: [web]
    restart: unless-stopped

  # Fetches pages with a headless browser and returns clean markdown for the web tool pack.
  crawl4ai:
    image: unclecode/crawl4ai:0.9.4
    shm_size: 1gb
    environment:
      # Without a token Crawl4AI binds its own loopback only and refuses outside connections.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-}
    ports:
      - "127.0.0.1:${CRAWL4AI_PORT:-11235}:11235"
    networks: [web]
    restart: unless-stopped

  # The only way out for agents' browsers and plugins' MCP servers (decisions D34, D36): a forward proxy
  # that reaches public addresses only (each name resolved here, the address checked is the one dialled).
  # They sit on internal networks with nothing else; this joins them and a normal network for its way out.
  egress:
    build:
      context: .
      dockerfile: apps/egress/Dockerfile
    image: superagent-egress:local
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [browsers, mcp, egress]
    init: true
    restart: unless-stopped

  # S3-compatible storage for uploaded documents (decision D09). One process, telemetry off; only the
  # S3 port is published, on loopback. Its other ports (filer, master, admin) have no auth, so it sits
  # on its own network that only the API joins. It refuses to start without S3 keys (anonymous S3
  # would be open); other services start without them.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$AWS_ACCESS_KEY_ID" && test -n "$$AWS_SECRET_ACCESS_KEY"
        || { echo "Set S3_ACCESS_KEY and S3_SECRET_KEY in .env" >&2; exit 1; };
        exec /entrypoint.sh mini -dir=/data -ip=seaweedfs -bucket=knowledge -master.telemetry=false -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - s3data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [storage]
    restart: unless-stopped

  # The only Docker client (decision D10): one locked-down sandbox container per task. Docker's
  # socket makes it root-equivalent, so it runs as a non-root user with no capabilities on a read-only
  # root, on a network only the API joins.
  runner:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    image: superagent-runner:local
    environment:
      # Refuses to start without one (set RUNNER_TOKEN in .env); other services start regardless.
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_WORKSPACES_VOLUME: superagent-workspaces
      RUNNER_IMAGES: '{"dev":"superagent-sandbox-dev:1"}'
      RUNNER_BROWSER_IMAGE: superagent-browser:1
      RUNNER_BROWSER_NETWORK: superagent-browsers
      RUNNER_BROWSER_PROXY: http://egress:3128
      RUNNER_MCP_IMAGE: superagent-mcp:1
      RUNNER_MCP_NETWORK: superagent-mcp
      RUNNER_MCP_PROXY: http://egress:3128
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Docker Desktop's socket is root:root 0660; on a Linux host, set the docker group's id.
    group_add: ["${DOCKER_SOCKET_GID:-0}"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [runner]
    init: true
    restart: unless-stopped

  # The "dev" sandbox image (node, python, git). Built with the stack, never started here: the runner
  # creates each task's sandbox from it.
  sandbox-dev:
    profiles: [app]
    build:
      context: infra/sandbox
      dockerfile: dev.Dockerfile
    image: superagent-sandbox-dev:1
    scale: 0

  # Backups (decision D41): scripts/backup.sh runs it to mirror the documents bucket into $BACKUP_DIR/s3.
  # Never started on its own. As root in the container, which is the server's user under rootless Docker;
  # with rootful Docker set BACKUP_USER to your uid:gid, or the mirror ends up owned by root.
  rclone:
    profiles: [backup]
    image: rclone/rclone:1.75.1
    user: ${BACKUP_USER:-0:0}
    environment:
      # Remotes come from the variables below: no config file.
      RCLONE_CONFIG: /dev/null
      RCLONE_CONFIG_LIVE_TYPE: s3
      RCLONE_CONFIG_LIVE_PROVIDER: SeaweedFS
      RCLONE_CONFIG_LIVE_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_LIVE_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      RCLONE_CONFIG_LIVE_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backup
    networks: [storage]

  # The image stdio MCP servers run in (Node, Python, uv). Built with the stack, never started here: the
  # runner creates one container per plugin from it, on the MCP network.
  mcp:
    profiles: [app, mcp]
    build:
      context: infra/mcp
    image: superagent-mcp:1
    scale: 0

  # The browser image (Chromium). Built with the stack, never started here: the runner creates each
  # task's browser from it, on the browsers network.
  browser:
    profiles: [app, browser]
    build:
      context: infra/browser
    image: superagent-browser:1
    scale: 0

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: superagent-api:local
    env_file: [.env]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4111"
      DATABASE_URL: postgres://superagent:${POSTGRES_PASSWORD}@postgres:5432/superagent
      SEARXNG_URL: http://searxng:8080
      CRAWL4AI_URL: http://crawl4ai:11235
      S3_ENDPOINT: http://seaweedfs:8333
      RUNNER_URL: http://runner:8080
    ports:
      - "127.0.0.1:${API_PORT:-4112}:4111"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      runner:
        condition: service_healthy
    networks: [core, web, storage, runner]
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

networks:
  # Postgres and the API.
  core: {}
  # The services that handle untrusted web content (Crawl4AI runs a browser on any page). The API
  # joins both networks; the fetchers can reach the internet but never Postgres.
  web: {}
  # Object storage and the API only.
  storage: {}
  # The runner and the API only; no way out.
  runner:
    internal: true
  # Browsers and the egress proxy (decision D34). Internal: no gateway, so the proxy is the only exit.
  # Named, because the runner attaches the browsers it creates to it.
  browsers:
    name: superagent-browsers
    internal: true
  # Plugins' stdio MCP servers and the egress proxy (decision D36): internal, like browsers, but apart
  # from them. Named, because the runner attaches the containers it creates to it.
  mcp:
    name: superagent-mcp
    internal: true
  # The egress proxy's own way out.
  egress: {}

volumes:
  pgdata:
  s3data:
