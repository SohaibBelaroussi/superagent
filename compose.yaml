name: superagent

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: superagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: superagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superagent -d superagent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: superagent-api:local
    env_file: [.env]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4111"
      DATABASE_URL: postgres://superagent:${POSTGRES_PASSWORD}@postgres:5432/superagent
    ports:
      - "127.0.0.1:${API_PORT:-4112}:4111"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
