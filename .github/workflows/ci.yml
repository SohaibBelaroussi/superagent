name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium sandboxes its renderers in user namespaces, which Ubuntu 24.04 restricts by default.
      - name: Allow user namespaces (Chromium's sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The integration tests start real browsers and MCP servers from them.
      - name: Build the browser and MCP images
        # Plain docker build: compose needs the .env that is only written further down.
        run: |
          docker build -t superagent-browser:1 infra/browser
          docker build -t superagent-mcp:1 infra/mcp

      # EE-import guard, lint, typecheck, unit tests, integration tests (Testcontainers Postgres).
      - name: pnpm check
        run: pnpm check

      - name: Create a throwaway .env for the packaged stack
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SUPERAGENT_ADMIN_TOKEN=sa_$(openssl rand -hex 32)"
            echo "SUPERAGENT_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "STUDIO_TOKEN=sa_$(openssl rand -hex 32)"
            echo "S3_ACCESS_KEY=$(openssl rand -hex 12)"
            echo "S3_SECRET_KEY=$(openssl rand -hex 24)"
            echo "RUNNER_TOKEN=$(openssl rand -hex 32)"
            echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)"
            echo "LOG_LEVEL=info"
            echo "MASTRA_TELEMETRY_DISABLED=true"
            echo "API_PORT=4112"
            echo "SUPERAGENT_VERSION=ci"
            echo "DOCKER_SOCKET=/var/run/docker.sock"
          } > .env

      - name: Build and tag the images
        # The API, the runner, the egress proxy, and the sandbox, browser and MCP images the runner starts.
        run: scripts/release.sh ci

      # The web app's libraries belong in its build, not in the API's dependencies (pnpm-workspace.yaml).
      - name: The API image carries no React
        run: |
          if docker run --rm --entrypoint ls superagent-api:ci node_modules/.pnpm | grep -E '^(react|react-dom)@'; then
            echo "React is in the API image's dependencies" >&2
            exit 1
          fi

      - name: Start the stack as the server runs it
        # From the tagged images with the production overrides (limits, nothing built): the API with its
        # database, document storage, runner and egress proxy. Web-tool services are faked in tests.
        run: >-
          docker compose -f compose.yaml -f compose.prod.yaml --profile app up -d --wait --wait-timeout 180
          postgres seaweedfs egress runner api

      - name: End-to-end tests against the container
        run: pnpm test:e2e

      # A real browser against the same container: the served web app, its CSP, sign-in, live updates.
      - name: Install Chromium for the browser tests
        run: pnpm --filter @superagent/web exec playwright install --with-deps chromium

      - name: Browser tests against the container
        run: pnpm test:web

      - name: Browser test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Back up the stack, then restore the backup in a drill
        env:
          COMPOSE_FILES: -f compose.yaml -f compose.prod.yaml
        run: |
          # A document and a secret stay, so the drill compares a real file and proves the key opens the
          # restored secrets. The token goes in a header file, never on a command line.
          printf 'Authorization: Bearer %s\n' "$(sed -n 's/^SUPERAGENT_ADMIN_TOKEN=//p' .env)" > "$RUNNER_TEMP/auth"
          printf 'Backups are proven by restoring them.\n' > "$RUNNER_TEMP/drill.txt"
          curl -fsS -o /dev/null -H @"$RUNNER_TEMP/auth" -F "file=@$RUNNER_TEMP/drill.txt;type=text/plain" \
            -F title=Drill http://127.0.0.1:4112/v1/knowledge
          curl -fsS -o /dev/null -H @"$RUNNER_TEMP/auth" -H 'content-type: application/json' -X PUT \
            --data '{"value":"drill"}' http://127.0.0.1:4112/v1/secrets/DRILL_KEY
          scripts/backup.sh
          scripts/restore-drill.sh

      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.prod.yaml --profile app logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.prod.yaml --profile app down -v
