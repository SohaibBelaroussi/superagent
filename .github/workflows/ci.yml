name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium sandboxes its renderers in user namespaces, which Ubuntu 24.04 restricts by default.
      - name: Allow user namespaces (Chromium's sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The integration tests start real browsers and MCP servers from them.
      - name: Build the browser and MCP images
        # Plain docker build: compose needs the .env that is only written further down.
        run: |
          docker build -t superagent-browser:1 infra/browser
          docker build -t superagent-mcp:1 infra/mcp

      # EE-import guard, lint, typecheck, unit tests, integration tests (Testcontainers Postgres).
      - name: pnpm check
        run: pnpm check

      - name: Create a throwaway .env for the packaged stack
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "SUPERAGENT_ADMIN_TOKEN=sa_$(openssl rand -hex 32)"
            echo "SUPERAGENT_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "STUDIO_TOKEN=sa_$(openssl rand -hex 32)"
            echo "S3_ACCESS_KEY=$(openssl rand -hex 12)"
            echo "S3_SECRET_KEY=$(openssl rand -hex 24)"
            echo "RUNNER_TOKEN=$(openssl rand -hex 32)"
            echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)"
            echo "LOG_LEVEL=info"
            echo "MASTRA_TELEMETRY_DISABLED=true"
            echo "API_PORT=4112"
            echo "SUPERAGENT_VERSION=ci"
            echo "DOCKER_SOCKET=/var/run/docker.sock"
          } > .env

      - name: Build and tag the images
        # The API, the runner, the egress proxy, and the sandbox, browser and MCP images the runner starts.
        run: scripts/release.sh ci

      # The web app's libraries belong in its build, not in the API's dependencies (pnpm-workspace.yaml).
      - name: The API image carries no React
        run: |
          if docker run --rm --entrypoint ls superagent-api:ci node_modules/.pnpm | grep -E '^(react|react-dom)@'; then
            echo "React is in the API image's dependencies" >&2
            exit 1
          fi

      - name: Start the stack as the server runs it
        # From the tagged images with the production overrides (limits, nothing built): the API with its
        # database, document storage, runner and egress proxy. Web-tool services are faked in tests.
        run: >-
          docker compose -f compose.yaml -f compose.prod.yaml --profile app up -d --wait --wait-timeout 180
          postgres seaweedfs egress runner api

      - name: End-to-end tests against the container
        run: pnpm test:e2e

      # A real browser against the same container: the served web app, its CSP, sign-in, live updates.
      - name: Install Chromium for the browser tests
        run: pnpm --filter @superagent/web exec playwright install --with-deps chromium

      - name: Browser tests against the container
        run: pnpm test:web

      - name: Browser test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Back up the stack, then restore the backup in a drill
        env:
          COMPOSE_FILES: -f compose.yaml -f compose.prod.yaml
        run: |
          # A document and a secret stay, so the drill compares a real file and proves the key opens the
          # restored secrets. The token goes in a header file, never on a command line.
          printf 'Authorization: Bearer %s\n' "$(sed -n 's/^SUPERAGENT_ADMIN_TOKEN=//p' .env)" > "$RUNNER_TEMP/auth"
          printf 'Backups are proven by restoring them.\n' > "$RUNNER_TEMP/drill.txt"
          curl -fsS -o /dev/null -H @"$RUNNER_TEMP/auth" -F "file=@$RUNNER_TEMP/drill.txt;type=text/plain" \
            -F title=Drill http://127.0.0.1:4112/v1/knowledge
          curl -fsS -o /dev/null -H @"$RUNNER_TEMP/auth" -H 'content-type: application/json' -X PUT \
            --data '{"value":"drill"}' http://127.0.0.1:4112/v1/secrets/DRILL_KEY
          scripts/backup.sh
          scripts/restore-drill.sh

      - name: Container logs
        if: failure()
        run: docker compose -f compose.yaml -f compose.prod.yaml --profile app logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.prod.yaml --profile app down -v

  # The phone app on an Android emulator: a release build (APP_VARIANT=test) driven by the Maestro flows
  # in apps/mobile/e2e, against the API run from source with its database.
  mobile-android:
    name: Android app on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7

      # Gradle and Maestro both run on Java 17, which the runner has.
      - name: Use Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start the API with a throwaway .env
        run: |
          password=$(openssl rand -hex 16)
          token="sa_$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          {
            echo "POSTGRES_PASSWORD=$password"
            echo "DATABASE_URL=postgres://superagent:$password@127.0.0.1:5432/superagent"
            echo "SUPERAGENT_ADMIN_TOKEN=$token"
            echo "SUPERAGENT_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "MASTRA_TELEMETRY_DISABLED=true"
          } > .env
          echo "MAESTRO_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
          docker compose up -d --wait postgres
          nohup pnpm --filter @superagent/api exec tsx src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          # The tests' fake model, which the flows' setup script makes the chief and the leads use.
          nohup pnpm --filter @superagent/api exec tsx test/support/fake-openai-server.ts 4199 \
            > "$RUNNER_TEMP/model.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:4111/ready; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      # Release, for the emulator's architecture only. The CMake version the app's config plugin names
      # (apps/mobile/plugins/cmake-version.js) isn't on the runner.
      - name: Build the app
        working-directory: apps/mobile
        env:
          APP_VARIANT: test
          NODE_ENV: production
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.31.6" > /dev/null
          pnpm exec expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The app reaches the API at 10.0.2.2, the emulator's name for this machine; the flows' setup
      # script reaches it at 127.0.0.1. Each line of the script runs on its own.
      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_API_URL: http://127.0.0.1:4111
          MAESTRO_APP_SERVER: http://10.0.2.2:4111
          MAESTRO_MODEL_URL: http://127.0.0.1:4199/v1
        with:
          api-level: 35
          target: default
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro --no-ansi test --test-output-dir "$RUNNER_TEMP/maestro" apps/mobile/e2e

      - name: Flow screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android
          path: |
            ${{ runner.temp }}/maestro
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/model.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the database
        if: always()
        run: docker compose down -v

  # The same app built for the iPhone simulator (no Apple account needed): it must build, and its
  # sign-in screen must work. Flows that need the server run on Android only.
  mobile-ios:
    name: iPhone app on a simulator
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the app for the simulator
        working-directory: apps/mobile
        env:
          APP_VARIANT: test
          NODE_ENV: production
        run: |
          set -o pipefail
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install
          xcodebuild -workspace superagent.xcworkspace -scheme superagent -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.11.0/maestro.zip
          echo "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Run the sign-in flow on a simulator
        run: |
          # An iPhone on the newest iOS the runner has.
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries | sort_by(.key) | reverse | .[].value[]
              | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" apps/mobile/ios/build/Build/Products/Release-iphonesimulator/superagent.app
          maestro --no-ansi --device "$udid" test --include-tags smoke --test-output-dir "$RUNNER_TEMP/maestro" apps/mobile/e2e

      - name: Flow screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          path: ${{ runner.temp }}/maestro
          retention-days: 7
          if-no-files-found: ignore
